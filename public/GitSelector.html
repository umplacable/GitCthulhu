<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/SelectorStyle.css">
    <title>Select a Git repository</title>
  </head>
  <body class="horyzontal">
    <article class="flex sideBar header">
      <h4>Projets</h4>
    </article>
    <div class="mainSelectWin">
      <!-- une zonne de recherche avec a coté un boutons de création. -->
      <article class="sectionRecherche flex">
        <input class="recherche" type="text" placeholder="Rechercher un dépôt" />
        <button>+</button>
      </article>
      
      <!-- en dessous, une zonne listant les dépos a ouvrir -->
      <section class="listRepo">
        <ul>
          <li>Projet 1</li>
          <li>Projet 2</li>
          <li>Projet 3</li>
          <li>Projet 4</li>
          <li>Projet 5</li>
          <li>Projet 6</li>
          <li>Projet 7</li>
          <li>Projet 8</li>
          <li>Projet 9</li>
          <li>Projet 10</li>
    </div>
  </body>
</html>
