name: Build Electron App

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Linux dependencies for AppImage, etc.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxss1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libxkbcommon-x11-0 \
            libopenjp2-7 \
            rpm\
            wine64 \
            wine32:i386 \
            libwine \
            winbind \
            mono-devel \
            nsis

      - name: Build Electron App
        run: |
          npx sass --load-path=node_modules/@picocss/pico/scss/ public/scss:dist/css
          npx webpack --mode production
          npx electron-builder --${{matrix.os == 'macos-latest' && 'mac' || 'linux --win' }}

      - name: Delete unnecessary files
        run: |
          rm -rf release/*-unpacked \
            release/*.yaml \
            release/*.yml

      - name: Publish & Release build
        uses: akkuman/gitea-release-action@v1
        with:
          files: |
            release/*
          draft: false