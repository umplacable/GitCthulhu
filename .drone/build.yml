kind: pipeline
type: docker
name: electron-build

platform:
  os: linux
  arch: amd64

steps:
  # ---------------------------------
  # 1. Installer Node et dépendances
  # ---------------------------------
  - name: Install Node
    image: node:20
    commands:
      - npm ci

  # -------------------------------
  # 2. Build Linux
  # -------------------------------
  - name: Build Linux
    image: node:20
    environment:
      ELECTRON_CACHE: /drone/src/.cache/electron
      ELECTRON_BUILDER_CACHE: /drone/src/.cache/electron-builder
    commands:
      - npx electron-builder --linux
    artifacts:
      paths:
        - release/**

  # -------------------------------
  # 3. Build Windows
  # -------------------------------
  - name: Build Windows
    image: electronuserland/builder:wine
    environment:
      ELECTRON_CACHE: /drone/src/.cache/electron
      ELECTRON_BUILDER_CACHE: /drone/src/.cache/electron-builder
    commands:
      - npm ci
      - npx electron-builder --win
    artifacts:
      paths:
        - release/**

  # -------------------------------
  # 4. Build macOS (optionnel, si runner macOS)
  # -------------------------------
  - name: Build macOS
    image: node:20
    when:
      os: darwin
    commands:
      - npm ci
      - npx electron-builder --mac
    artifacts:
      paths:
        - release/**

  # -------------------------------
  # 5. Upload artifacts
  # -------------------------------
  - name: Upload artifacts
    image: alpine
    commands:
      - mkdir -p artifacts
      - cp -r dist/* artifacts/
    artifacts:
      paths:
        - artifacts/**
  # -------------------------------
  # 6. Publish Release to Gitea
  # -------------------------------   
  - name: Publish Release
    image: node:20
    environment:
      GITEA_TOKEN:
        from_secret: GITEATOKEN
    commands:
      - node scripts/publish-gitea.js
